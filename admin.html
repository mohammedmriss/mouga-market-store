<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'self' https://*.workers.dev; base-uri 'self'; form-action 'self'; object-src 'none"><title>Admin | Mouga Market</title><link rel="stylesheet" href="css/style.css"><script defer src="js/admin.js"></script></head>
<body><main class="admin-main"><h1>Mouga Market Admin</h1><p id="admin-message" class="admin-status" role="status"></p>
  <section id="login-panel" class="admin-panel"><h2>Sign in</h2><form id="login-form" class="admin-form"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button" type="submit">Log in</button></form><button class="button button-light" id="retry-session" type="button" hidden>Retry saved session</button></section>
  <section id="dashboard" hidden><div class="admin-layout"><aside class="admin-sidebar"><strong>Store Admin</strong><a href="#dashboard-panel">Dashboard</a><a href="#products-panel">Products</a><a href="#categories-panel">Categories</a><a href="#orders-panel">Orders</a><button class="button button-light logout" type="button">Log out</button></aside><div class="admin-main">
    <section id="dashboard-panel" class="admin-panel"><h2>Dashboard</h2><button class="button" data-load="products">Reload products</button><button class="button button-light" id="retry-admin" type="button">Retry loading admin data</button><p id="product-count"></p><p id="product-stats"></p><p id="sales-stats"></p><div id="recent-orders"></div><div id="product-list"></div></section>
    <section id="products-panel" class="admin-panel"><h2>Add / edit product</h2><form id="product-form" class="admin-form"><label>Product ID<input name="id" required pattern="[a-z0-9-]+" maxlength="80"></label><label>Name<input name="name" required maxlength="120"></label><label>Category<select name="category" required></select></label><label>Price (MAD)<input name="price" type="number" min="0" required></label><label>Stock<input name="stock" type="number" min="0" required></label><label>Status<select name="status"><option value="draft">Draft</option><option value="active">Active</option></select></label><label>Badge<input name="badge" maxlength="60"></label><label>Image URLs (one per line)<textarea name="images"></textarea></label><label>Sizes (comma separated)<input name="sizes"></label><label>Colors (comma separated)<input name="colors"></label><label>Description<textarea name="description" maxlength="1500" required></textarea></label><button class="button" type="submit">Save product</button></form></section>
    <section id="categories-panel" class="admin-panel"><h2>Categories</h2><form id="category-form" class="admin-form"><label>Category ID<input name="id" required pattern="[a-z0-9-]+"></label><label>Category name<input name="name" required maxlength="80"></label><button class="button" type="submit">Add category</button></form><div id="category-list"></div></section>
    <section id="orders-panel" class="admin-panel"><h2>Orders</h2><label>Filter by status<select id="order-status-filter"><option value="">All</option><option>new</option><option>confirmed</option><option>shipped</option><option>delivered</option><option>cancelled</option></select></label><label>Search name or phone<input id="order-search" type="search"></label><button class="button" id="reload-orders" type="button">Refresh orders</button> <button class="button button-light" id="export-orders" type="button">Export CSV</button><div id="orders-list"></div></section>
    <section id="analytics-panel" class="admin-panel"><h2>Analytics</h2><p id="analytics-summary"></p></section>
    <section id="appearance-panel" class="admin-panel"><h2>Design / appearance</h2><form id="appearance-form" class="admin-form">
      <label>Store name<input name="storeName" required maxlength="100"></label><label>Logo URL<input name="logoUrl" type="url"></label>
      <label>Primary color<input name="primaryColor" type="color"></label><label>Secondary color<input name="secondaryColor" type="color"></label>
      <label>System font<select name="font"><option>system-ui</option><option>Arial</option><option>Georgia</option><option>Tahoma</option></select></label>
      <label>Announcement<input name="announcementText" maxlength="200"></label><label><input name="announcementEnabled" type="checkbox"> Show announcement</label>
      <label>Store phone<input name="phone" type="tel" maxlength="30"></label><label>WhatsApp number<input name="whatsapp" type="tel" maxlength="30"></label><label>Store email<input name="email" type="email" maxlength="120"></label>
      <label>Footer text<input name="footerText" maxlength="250"></label><label>Facebook Pixel ID<input name="facebookPixelId" maxlength="40"></label>
      <label>Hero slides (JSON array)<textarea name="slides" placeholder='[{"image":"https://...","title":"...","description":"...","buttonText":"...","buttonLink":"...","enabled":true}]'></textarea></label>
      <label><input name="showBenefits" type="checkbox"> Show benefits</label><label><input name="showAbout" type="checkbox"> Show about section</label><label><input name="showContact" type="checkbox"> Show contact section</label>
      <div id="appearance-preview" class="admin-status" aria-live="polite">Live preview</div><button class="button" type="submit">Save appearance</button>
    </form></section>
    <button class="button logout" type="button">Log out</button>
  </div></div></section>
</main></body></html>
